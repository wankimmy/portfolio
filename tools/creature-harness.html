<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Creature harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #070a12;
        color: #e8ecf4;
        font: 14px system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #gl {
        position: absolute;
        left: -9999px;
      }
      body.live #gl {
        position: static;
      }
      body.live #sheet {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="sheet"></canvas>
    <script type="module" src="./creature-harness.js"></script>
  </body>
</html>
