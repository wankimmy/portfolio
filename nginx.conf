# Rate limit for the AI chat proxy: per-IP, generous enough for a normal conversation
limit_req_zone $binary_remote_addr zone=ollama_chat:10m rate=15r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # AI chatbot proxy -> Ollama Cloud. The API key is injected here so it never
    # reaches the browser. ${OLLAMA_API_KEY} is substituted by the nginx image's
    # envsubst at container start (this file is mounted as a template).
    location = /api/ollama/chat {
        limit_req zone=ollama_chat burst=10 nodelay;

        proxy_pass https://ollama.com/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host ollama.com;
        proxy_set_header Authorization "Bearer ${OLLAMA_API_KEY}";
        proxy_ssl_server_name on;

        # Streaming responses: do not buffer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }
}
