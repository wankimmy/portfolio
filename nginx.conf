# safwanhakim.com - static site plus the AI chat proxy.
# Runs behind Traefik (TLS, HSTS and redirects live there). This file is an
# envsubst template: only ${OLLAMA_API_KEY} is substituted at container start.

# Traefik is the only client nginx sees: take the visitor address from its header
# so the per-visitor chat limit is per visitor, not per proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Chat proxy limits: a normal conversation per visitor, and a hard ceiling for
# the whole site so the upstream key cannot be drained through this endpoint.
limit_req_zone $binary_remote_addr zone=ollama_chat:10m rate=15r/m;
limit_req_zone $server_name zone=ollama_total:1m rate=40r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml+rss image/svg+xml model/gltf-binary application/wasm;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Leftovers from the old shared-hosting deploy must never be served as text.
    location ~ (^|/)\.|\.php$ {
        return 404;
    }

    # Vite output: content-hashed names, safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else in public/ keeps its name between releases: cache for a
    # week. Missing files must 404, not fall through to index.html.
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff2|wasm|mp4|pdf|js|css)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # AI chat -> Ollama Cloud. The key is added here and never reaches the browser.
    location = /api/ollama/chat {
        limit_except POST { deny all; }
        # browsers always send Origin on a POST: refuse other sites using this as their chat backend
        if ($http_origin !~ "^https://(www\.)?safwanhakim\.com$") { return 403; }
        limit_req zone=ollama_chat burst=10 nodelay;
        limit_req zone=ollama_total burst=20 nodelay;
        limit_req_status 429;

        proxy_pass https://ollama.com/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host ollama.com;
        proxy_set_header Authorization "Bearer ${OLLAMA_API_KEY}";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;

        # streamed reply: pass tokens through as they arrive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    # the app is one page: unknown paths get the shell
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
