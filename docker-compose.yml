# Local development: Vite with HMR for source only.
# public/ (models, videos, draco) is baked into the image so Docker Desktop
# does not serve multi-MB assets through the slow Windows bind mount.
# After changing public/ media: docker compose up -d --build
# (or: docker cp ./public/models/dragon-hero.glb portfolio-app:/app/public/models/)
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio-app
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
      - /app/node_modules
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
