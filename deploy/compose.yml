# safwanhakim.com on the shared VPS, behind the existing Traefik (network "edge").
# Run from /docker/portfolio with TAG set; OLLAMA_API_KEY comes from the
# root-only .env beside it. HTTPS certificates are switched on by the overlay
# compose.acme.yml, only once the domain resolves to this server.
name: portfolio

services:
  site:
    image: portfolio-site:${TAG:?set TAG to the release to run}
    container_name: portfolio-site
    restart: unless-stopped
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    networks:
      - edge
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.services.portfolio.loadbalancer.server.port: "80"

      traefik.http.routers.portfolio.rule: Host(`safwanhakim.com`) || Host(`www.safwanhakim.com`)
      traefik.http.routers.portfolio.entrypoints: websecure
      traefik.http.routers.portfolio.tls: "true"
      traefik.http.routers.portfolio.service: portfolio
      traefik.http.routers.portfolio.middlewares: portfolio-www,portfolio-security

      # www goes to the bare domain, one canonical address
      traefik.http.middlewares.portfolio-www.redirectregex.regex: ^https?://www\.safwanhakim\.com/(.*)
      traefik.http.middlewares.portfolio-www.redirectregex.replacement: https://safwanhakim.com/$${1}
      traefik.http.middlewares.portfolio-www.redirectregex.permanent: "true"

      traefik.http.middlewares.portfolio-security.headers.stsSeconds: "31536000"
      traefik.http.middlewares.portfolio-security.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.portfolio-security.headers.customFrameOptionsValue: SAMEORIGIN
      traefik.http.middlewares.portfolio-security.headers.referrerPolicy: strict-origin-when-cross-origin

networks:
  edge:
    external: true
